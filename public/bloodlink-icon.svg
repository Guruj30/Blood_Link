  <path d="M50 16 C50 16 26 48 26 68 C26 74 28 80 32 84 C28 78 28 66 38 48 C44 38 50 24 50 16 Z"
        fill="url(#glowGrad)" />
  <!-- Medical Plus / Link Symbol in Center -->
  <g fill="#FFFFFF" opacity="0.95">
    <rect x="46" y="55" width="8" height="22" rx="4" />
    <rect x="39" y="62" width="22" height="8" rx="4" />
  </g>
</svg>
