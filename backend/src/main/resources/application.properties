# BloodLink Healthcare Platform - Backend Configuration
spring.application.name=bloodlink-backend
server.port=8080

# CORS Configuration - verified Vite frontend origin
bloodlink.cors.allowed-origins=http://localhost:5173

# Business Rules Configuration
bloodlink.donor.min-donation-interval-days=90
bloodlink.inventory.default-low-threshold=15

# Persistence Configuration (Member 4 Integration)
# Modes: JDBC_MYSQL (Active MySQL database via JDBC) or IN_MEMORY (Standalone mock mode)
bloodlink.persistence.mode=JDBC_MYSQL

# MySQL JDBC Data Source Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodlink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging
logging.level.com.bloodlink=DEBUG
logging.level.org.springframework.web=INFO
