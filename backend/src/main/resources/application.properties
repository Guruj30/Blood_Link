# BloodLink Healthcare Platform - Backend Configuration
spring.application.name=bloodlink-backend
server.port=8080

# Disable automatic DataSource initialization so app starts reliably in both IN_MEMORY and JDBC modes
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# CORS Configuration - verified Vite frontend origin
bloodlink.cors.allowed-origins=http://localhost:5173

# Business Rules Configuration
bloodlink.donor.min-donation-interval-days=90
bloodlink.inventory.default-low-threshold=15

# Persistence Configuration (Member 4 Integration)
# Modes: JDBC_MYSQL (Active MySQL database via JDBC) or IN_MEMORY (Standalone offline mode)
# Defaults to IN_MEMORY when MySQL is not running; set PERSISTENCE_MODE=JDBC_MYSQL to connect to MySQL
bloodlink.persistence.mode=${PERSISTENCE_MODE:IN_MEMORY}

# MySQL JDBC Data Source Configuration (used when PERSISTENCE_MODE=JDBC_MYSQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bloodlink?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging
logging.level.com.bloodlink=DEBUG
logging.level.org.springframework.web=INFO
